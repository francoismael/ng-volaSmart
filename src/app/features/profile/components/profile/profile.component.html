<div class="vs-toolbar">
  <div>
    <h1 class="vs-toolbar-title">Mon Profil</h1>
    <p class="vs-toolbar-sub">Gérez vos informations personnelles</p>
  </div>
</div>

<div class="vs-profile-grid">
  <!-- Personal Info Card -->
  <div class="vs-card">
    <div class="vs-card-header">
      <span class="vs-card-title">Informations personnelles</span>
    </div>
    <div class="vs-card-body">
      <div class="vs-profile-avatar-wrap">
        <div class="vs-profile-avatar">
          {{ username() ? username()[0].toUpperCase() : '?' }}
        </div>
        <div class="vs-profile-avatar-info">
          <div style="font-weight:600;font-size:0.95rem;">{{ username() || 'Utilisateur' }}</div>
          <div style="font-size:0.8rem;color:var(--text-muted);">Compte actif</div>
        </div>
      </div>
      <div class="vs-form-group">
        <label class="vs-label">Nom d'utilisateur</label>
        <input [(ngModel)]="usernameInput" type="text" class="vs-input" />
      </div>
      <div class="vs-form-group">
        <label class="vs-label">Email</label>
        <input [(ngModel)]="emailInput" type="email" class="vs-input" />
      </div>
      <div class="vs-form-group">
        <label class="vs-label">Solde initial <span style="font-weight:400;color:var(--text-muted);">(Ar)</span></label>
        <input [(ngModel)]="initialBalanceInput" type="number" min="0" class="vs-input" placeholder="0" />
        <div style="font-size:0.75rem;color:var(--text-muted);margin-top:4px;">Montant de départ de votre budget personnel</div>
      </div>
      <button class="vs-btn vs-btn-primary vs-btn-block" (click)="saveProfile()" [disabled]="profileLoading()">
        @if (profileLoading()) {
          <span class="vs-spinner"></span>
        } @else {
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/>
          </svg>
        }
        Enregistrer
      </button>
    </div>
  </div>

  <!-- Change Password Card -->
  <div class="vs-card">
    <div class="vs-card-header">
      <span class="vs-card-title">Sécurité</span>
    </div>
    <div class="vs-card-body">
      <p style="font-size:0.8rem;color:var(--text-muted);margin-bottom:1.25rem;">
        Choisissez un mot de passe fort d'au moins 6 caractères.
      </p>
      <div class="vs-form-group">
        <label class="vs-label">Mot de passe actuel</label>
        <div class="vs-input-wrap">
          <input [(ngModel)]="currentPassword" [type]="showCurrentPw() ? 'text' : 'password'" class="vs-input" style="padding-right:2.75rem" placeholder="••••••" />
          <button type="button" class="vs-input-suffix" (click)="showCurrentPw.update(v => !v)">
            @if (showCurrentPw()) {
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/>
                <line x1="1" y1="1" x2="23" y2="23"/>
              </svg>
            } @else {
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>
              </svg>
            }
          </button>
        </div>
      </div>
      <div class="vs-form-group">
        <label class="vs-label">Nouveau mot de passe</label>
        <div class="vs-input-wrap">
          <input [(ngModel)]="newPassword" [type]="showNewPw() ? 'text' : 'password'" class="vs-input" style="padding-right:2.75rem" placeholder="Minimum 6 caractères" />
          <button type="button" class="vs-input-suffix" (click)="showNewPw.update(v => !v)">
            @if (showNewPw()) {
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/>
                <line x1="1" y1="1" x2="23" y2="23"/>
              </svg>
            } @else {
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>
              </svg>
            }
          </button>
        </div>
      </div>
      <div class="vs-form-group">
        <label class="vs-label">Confirmer le mot de passe</label>
        <input [(ngModel)]="confirmPassword" type="password" class="vs-input" placeholder="••••••" />
      </div>
      <button class="vs-btn vs-btn-success vs-btn-block" (click)="changePassword()" [disabled]="passwordLoading()">
        @if (passwordLoading()) {
          <span class="vs-spinner"></span>
        } @else {
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>
          </svg>
        }
        Modifier le mot de passe
      </button>
    </div>
  </div>
</div>
