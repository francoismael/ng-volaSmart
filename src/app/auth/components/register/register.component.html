<div class="vs-auth-wrap">
    <!-- Left Panel — Blue gradient with brand -->
    <div class="vs-auth-left">
        <div class="vs-auth-left-content">
            <div class="vs-auth-brand">
                <div class="vs-auth-brand-icon">
                    <svg width="28" height="28" viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M4 6 L14 26 L16 22 L18 26 L28 6" stroke="white" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
                        <circle cx="16" cy="27" r="2" fill="#93C5FD"/>
                    </svg>
                </div>
                <div class="vs-auth-brand-name">VolaSmart</div>
            </div>
            <p class="vs-auth-desc">
                Créez votre compte et commencez à tracker vos finances en moins de 2 minutes.
            </p>
        </div>

        <!-- 3-layer cloud right edge (desktop) — wide soft bumps -->
        <div class="vs-auth-edge-right">
            <svg class="vs-edge-layer" viewBox="0 0 200 1000" preserveAspectRatio="none">
                <path d="M200,0 L200,1000 L80,1000 C80,1000 80,900 20,800 C-40,700 80,600 80,500 C80,400 -40,300 20,200 C80,100 80,0 80,0 Z" fill="white" fill-opacity="0.12"/>
            </svg>
            <svg class="vs-edge-layer" viewBox="0 0 200 1000" preserveAspectRatio="none">
                <path d="M200,0 L200,1000 L120,1000 C120,1000 120,920 60,820 C0,720 120,620 120,500 C120,380 0,280 60,180 C120,80 120,0 120,0 Z" fill="white" fill-opacity="0.25"/>
            </svg>
            <svg class="vs-edge-layer" viewBox="0 0 200 1000" preserveAspectRatio="none">
                <path d="M200,0 L200,1000 L150,1000 C150,1000 150,910 100,820 C50,730 150,640 150,500 C150,360 50,270 100,180 C150,90 150,0 150,0 Z" fill="white"/>
            </svg>
        </div>

        <!-- 3-layer cloud bottom edge (mobile) — wide soft bumps -->
        <div class="vs-auth-edge-bottom">
            <svg class="vs-edge-layer-h" viewBox="0 0 1000 200" preserveAspectRatio="none">
                <path d="M0,200 L1000,200 L1000,80 C1000,80 900,80 800,20 C700,-40 600,80 500,80 C400,80 300,-40 200,20 C100,80 0,80 0,80 Z" fill="white" fill-opacity="0.12"/>
            </svg>
            <svg class="vs-edge-layer-h" viewBox="0 0 1000 200" preserveAspectRatio="none">
                <path d="M0,200 L1000,200 L1000,120 C1000,120 920,120 820,60 C720,0 620,120 500,120 C380,120 280,0 180,60 C80,120 0,120 0,120 Z" fill="white" fill-opacity="0.25"/>
            </svg>
            <svg class="vs-edge-layer-h" viewBox="0 0 1000 200" preserveAspectRatio="none">
                <path d="M0,200 L1000,200 L1000,150 C1000,150 910,150 820,100 C730,50 640,150 500,150 C360,150 270,50 180,100 C90,150 0,150 0,150 Z" fill="white"/>
            </svg>
        </div>
    </div>

    <!-- Right Panel — Register form -->
    <div class="vs-auth-right">
        <div class="vs-auth-card">
            <h1 class="vs-auth-title">Créer un compte</h1>
            <p class="vs-auth-subtitle">Commencez à gérer vos finances dès aujourd'hui</p>

            @if (error()) {
                <div class="vs-alert vs-alert-danger">
                    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink: 0">
                        <circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/>
                    </svg>
                    {{ error() }}
                </div>
            }
            @if (success()) {
                <div class="vs-alert vs-alert-success">
                    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink: 0">
                        <polyline points="20 6 9 17 4 12"/>
                    </svg>
                    {{ success() }}
                </div>
            }

            <form (ngSubmit)="onSubmit()">
                <div class="vs-form-group">
                    <label class="vs-label">Nom d'utilisateur</label>
                    <div class="vs-input-wrap">
                        <span class="vs-input-icon">
                            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/>
                            </svg>
                        </span>
                        <input [(ngModel)]="username" name="username" type="text" class="vs-input" placeholder="nom d'utilisateur ex:ismael"/>
                    </div>
                </div>
                <div class="vs-form-group">
                    <label class="vs-label">Email</label>
                    <div class="vs-input-wrap">
                        <span class="vs-input-icon">
                            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/>
                            </svg>
                        </span>
                        <input [(ngModel)]="email" name="email" type="email" class="vs-input" placeholder="mail"/>
                    </div>
                </div>
                <div class="vs-form-group">
                    <label class="vs-label">Mot de passe</label>
                    <div class="vs-input-wrap">
                        <span class="vs-input-icon">
                            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>
                            </svg>
                        </span>
                        <input [(ngModel)]="password" name="password" [type]="showPassword() ? 'text' : 'password'" class="vs-input" placeholder="Minimum 12 caractères" style="padding-right: 2.75rem"/>
                        <button type="button" class="vs-input-suffix" (click)="togglePassword()">
                            @if (showPassword()) {
                                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/>
                                    <line x1="1" y1="1" x2="23" y2="23"/>
                                </svg>
                            } @else {
                                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>
                                </svg>
                            }
                        </button>
                    </div>
                </div>

                <div class="vs-auth-actions">
                    <button type="submit" class="vs-btn vs-btn-primary vs-btn-lg" [disabled]="isLoading()">
                        @if (isLoading()) {
                            <span class="vs-spinner"></span> Création...
                        } @else {
                            Créer mon compte
                        }
                    </button>
                    <a routerLink="/auth/login" class="vs-btn-outline-auth">Se connecter</a>
                </div>
            </form>

        </div>
    </div>
</div>
